name: Apply Draw2 Gameplay Hotfix Once

on:
  push:
    branches:
      - codex/draw2-gameplay-hotfix-6
    paths:
      - '.github/workflows/apply-draw2-gameplay-hotfix-once.yml'
      - '_patches/draw2_index_gameplay_hotfix.patch.b64'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply encoded patch
        run: |
          base64 -d _patches/draw2_index_gameplay_hotfix.patch.b64 > /tmp/draw2_hotfix.patch
          git apply --check /tmp/draw2_hotfix.patch
          git apply /tmp/draw2_hotfix.patch

      - name: Remove temporary hotfix files
        run: |
          rm -f _patches/draw2_index_gameplay_hotfix.patch.b64
          rm -f _tmp_hotfix_note.txt
          rm -f .github/workflows/apply-draw2-gameplay-hotfix-once.yml
          rmdir _patches 2>/dev/null || true

      - name: Commit applied hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix CrocoDraw gameplay refresh and word change"
          git push origin "HEAD:${GITHUB_REF_NAME}"
